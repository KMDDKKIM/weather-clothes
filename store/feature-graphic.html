<!doctype html>
<!-- 구글 플레이 그래픽 이미지(1024x500) 원본. Edge headless로 PNG를 만든다 (store/README 참고) -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        background: linear-gradient(120deg, #fff8ee 0%, #ffe7dc 100%);
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        color: #2d2a26;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
        box-sizing: border-box;
      }
      .icon {
        width: 260px;
        height: 260px;
        border-radius: 58px;
        overflow: hidden;
        flex: none;
        box-shadow: 0 16px 40px rgba(232, 106, 58, 0.25);
      }
      .icon img {
        width: 100%;
        height: 100%;
        display: block;
      }
      h1 {
        font-size: 76px;
        font-weight: 800;
        margin: 0 0 18px;
        letter-spacing: -2px;
      }
      p {
        font-size: 32px;
        line-height: 1.45;
        margin: 0;
        color: #5a534b;
        letter-spacing: -0.5px;
      }
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 26px;
      }
      .chip {
        background: #ff8a5b;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        border-radius: 999px;
        padding: 8px 18px;
      }
    </style>
  </head>
  <body>
    <div class="icon"><img src="../public/icon.svg" alt="" /></div>
    <div>
      <h1>오늘 뭐 입혀?</h1>
      <p>등원·하원 시간과 낮 최고기온으로<br />우리 아이 옷차림을 알려드려요</p>
      <div class="chips">
        <span class="chip">덥지 않게</span>
        <span class="chip">춥지 않게</span>
        <span class="chip">색 조합까지</span>
      </div>
    </div>
  </body>
</html>
